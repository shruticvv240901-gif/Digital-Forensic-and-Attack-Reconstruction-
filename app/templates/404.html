{% extends "base.html" %}

{% block title %}Error | AI Attack Timeline Reconstruction{% endblock %}

{% block content %}
<div style="text-align: center; padding: 5rem 1rem;">
  <div style="font-size: 3rem; color: var(--cyber-red); margin-bottom: 1rem;">⚠️</div>
  <h2 style="font-size: 2rem; color: #ffffff; margin-bottom: 0.8rem;">Resource Not Found</h2>
  <p style="color: var(--text-muted); max-width: 500px; margin: 0 auto 2rem auto;">
    {{ error or "The requested route or forensic telemetry resource could not be found." }}
  </p>
  <a href="{{ url_for('main.dashboard') }}" class="btn btn-cyber-primary">
    Return to Dashboard
  </a>
</div>
{% endblock %}
